services:
  mysql:
    image: mysql:8.0
    container_name: simplipal_mysql

    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: dbname

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: simplipal_app

    depends_on:
      mysql:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: on-failure

    stdin_open: true
    tty: true

volumes:
  mysql_data: