name: Build Simplipal

on:
  push:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================
      # Ubuntu Dependencies
      # ==========================
      - name: Install Ubuntu Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            g++ \
            pkg-config \
            libjsoncpp-dev \
            libsodium-dev \
            libfmt-dev \
            libspdlog-dev \
            libmysqlcppconn-dev

      # ==========================
      # Windows Dependencies
      # ==========================
      - name: Clone vcpkg
        if: runner.os == 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat

      - name: Restore vcpkg Cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            build/vcpkg_installed
            vcpkg/downloads
          key: ${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-

      # ==========================
      # Configure (Linux)
      # ==========================
      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -S .

      # ==========================
      # Configure (Windows)
      # ==========================
      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          cmake -B build `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DVCPKG_FEATURE_FLAGS=manifests

      # ==========================
      # Build (Linux)
      # ==========================
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --build build --parallel

      # ==========================
      # Package (Linux)
      # ==========================
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          cp build/app release/
          cp README.md release/ || true
          cp LICENSE release/ || true
          if [ -d config ]; then cp -r config release/; fi
          tar -czf Simplipal-Linux.tar.gz -C release .

      # ==========================
      # Upload Linux Artifact
      # ==========================
      - name: Upload Linux Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Simplipal-Linux
          path: Simplipal-Linux.tar.gz

      # ==========================
      # Build (Windows)
      # ==========================
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --build build --config Release

      # ==========================
      # Package (Windows)
      # ==========================
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release

          Copy-Item "build\Release\app.exe" "release\"

          if (Test-Path "README.md") {
            Copy-Item "README.md" "release\"
          }

          if (Test-Path "LICENSE") {
            Copy-Item "LICENSE" "release\"
          }

          if (Test-Path "config") {
            Copy-Item "config" "release\" -Recurse
          }

          Compress-Archive -Path release\* -DestinationPath Simplipal-Windows.zip -Force

      # ==========================
      # Upload Windows Artifact
      # ==========================
      - name: Upload Windows Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Simplipal-Windows
          path: Simplipal-Windows.zip